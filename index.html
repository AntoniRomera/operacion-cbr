<style>
:root{
  --ground:#14181D; --surface:#1D242C; --surface-2:#252E38; --line:#333F4B;
  --ink:#E8EDF2; --muted:#8496A6; --dim:#5C6C7A;
  --p25:#C8342E; --p20:#2B5FA8; --p15:#D9A521; --p10:#2E8B57; --p5:#DDE4EA;
  --steel:#8B9AA8;
  --display:"Oswald",-apple-system,sans-serif;
  --body:"IBM Plex Sans",-apple-system,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
     padding-bottom:calc(96px + env(safe-area-inset-bottom));overscroll-behavior-y:none}

.top{position:sticky;top:0;z-index:40;background:rgba(20,24,29,.94);backdrop-filter:blur(12px);
     border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top__bar{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 10px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;margin:0}
.brand span{color:var(--p25)}
.week{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.week b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:6px;padding:0 12px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;
     padding:8px 13px;cursor:pointer;font-family:var(--display);font-size:13px;font-weight:600;
     letter-spacing:.09em;text-transform:uppercase;transition:background .15s,color .15s,border-color .15s}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tab--info{font-family:var(--mono);letter-spacing:0}

.day-head{padding:20px 16px 4px}
.day-title{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;
           text-transform:uppercase;margin:0;line-height:1}
.day-sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
.meter{display:flex;gap:3px;margin-top:12px}
.meter i{flex:1;height:3px;background:var(--line);border-radius:2px;transition:background .2s}
.meter i.on{background:var(--p10)}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:12px 12px 0;overflow:hidden}
.ex__head{padding:14px 14px 0;display:flex;gap:10px;align-items:flex-start}
.ex__txt{flex:1;min-width:0}
.ex__name{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em;
          text-transform:uppercase;margin:0;line-height:1.2}
.ex__meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:.04em}
.ex__meta em{color:var(--dim);font-style:normal}
.badge{display:inline-block;margin-top:9px;font-family:var(--mono);font-size:10.5px;font-weight:600;
       letter-spacing:.1em;text-transform:uppercase;background:var(--p10);color:#08120C;padding:3px 8px;border-radius:4px}
.tech-btn{flex:0 0 auto;width:40px;height:40px;border:1px solid var(--line);background:var(--surface-2);
          border-radius:9px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.tech-btn[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.tech-btn svg{width:20px;height:20px;pointer-events:none}

.tech{margin:12px 14px 0;border:1px solid var(--line);border-radius:10px;background:var(--ground);overflow:hidden}
.tech__stage{display:block;width:100%;height:auto;background:var(--ground)}
.tech__cues{list-style:none;margin:0;padding:12px 14px 14px;border-top:1px solid var(--line)}
.tech__cues li{position:relative;padding-left:16px;margin-bottom:7px;font-size:13.5px;color:#C3CEDA;line-height:1.45}
.tech__cues li:last-child{margin-bottom:0}
.tech__cues li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:2px;background:var(--p20)}
.tech__cues li.risk::before{background:var(--p25);height:8px;width:2px;top:5px}

.load{padding:14px}
.load__row{display:flex;align-items:center;gap:10px}
.step{width:44px;height:44px;flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);
      color:var(--ink);border-radius:10px;cursor:pointer;font-size:20px;font-family:var(--mono);line-height:1}
.step:disabled{opacity:.28;cursor:default}
.step:active:not(:disabled){background:var(--line)}
.load__val{flex:1;text-align:center;font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.02em}
.load__val small{font-size:12px;color:var(--muted);margin-left:3px;font-weight:400}
.load__note{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;margin-top:8px}

.bar{display:flex;align-items:center;justify-content:center;height:76px;margin-top:12px;background:var(--ground);
     border-radius:10px;border:1px solid var(--line);padding:0 8px;overflow:hidden}
.bar__side{display:flex;align-items:center;gap:2px;flex:1}
.bar__side--l{justify-content:flex-end}
.bar__side--r{justify-content:flex-start}
.bar__shaft{flex:0 0 auto;width:58px;height:7px;background:linear-gradient(180deg,#A9B6C2,#6E7C89);border-radius:2px;position:relative}
.bar__shaft::before,.bar__shaft::after{content:"";position:absolute;top:-6px;width:5px;height:19px;background:var(--steel);border-radius:1px}
.bar__shaft::before{left:-2px}
.bar__shaft::after{right:-2px}
.plate{flex:0 0 auto;border-radius:3px;display:flex;align-items:center;justify-content:center;
       font-family:var(--mono);font-size:10px;font-weight:600;animation:seat .22s ease-out}
@keyframes seat{from{transform:scaleY(.5);opacity:0}to{transform:scaleY(1);opacity:1}}
.bar__empty{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.bar__tags{display:flex;justify-content:space-between;padding:0 4px;margin-top:6px;
           font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}

.sets{display:flex;gap:7px;padding:0 14px 14px;flex-wrap:wrap}
.set{flex:1;min-width:56px;height:50px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;
     cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:13px;font-weight:500;
     transition:background .15s,color .15s,border-color .15s}
.set.done{background:var(--p10);border-color:var(--p10);color:#08120C;font-weight:600}
.set:active{transform:scale(.97)}
.reps{display:flex;align-items:center;gap:10px;padding:0 14px 14px}
.reps__label{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;flex:1}
.reps__box{display:flex;align-items:center;gap:8px}
.reps__val{font-family:var(--mono);font-size:17px;font-weight:600;min-width:30px;text-align:center}
.mini{width:36px;height:36px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
      border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:16px;line-height:1}

.rest{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);
      padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;gap:14px}
.rest.on{display:flex}
.rest__t{font-family:var(--mono);font-size:24px;font-weight:600;min-width:66px}
.rest__track{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.rest__fill{height:100%;background:var(--p20);width:100%;transition:width 1s linear}
.rest__skip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;
            padding:9px 13px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

.actions{padding:20px 12px 8px;display:flex;flex-direction:column;gap:9px}
.btn{width:100%;padding:15px;border-radius:11px;cursor:pointer;font-family:var(--display);font-size:14px;
     font-weight:600;letter-spacing:.11em;text-transform:uppercase;border:1px solid var(--line);
     background:var(--surface);color:var(--ink)}
.btn--go{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn:active{opacity:.8}

.guide{padding:8px 16px 24px;max-width:640px}
.guide h2{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
          margin:28px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.guide h2:first-child{margin-top:12px}
.guide p{color:#C3CEDA;margin:0 0 12px}
.guide ul{margin:0 0 12px;padding-left:18px;color:#C3CEDA}
.guide li{margin-bottom:7px}
.guide code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:4px;color:var(--ink)}
.guide strong{color:var(--ink)}
.warn{border-left:3px solid var(--p25);background:var(--surface);padding:12px 14px;border-radius:0 9px 9px 0;margin:0 0 14px}
.warn p{margin:0;color:#D6DEE6}
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px;margin-bottom:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;padding:7px 6px;border-bottom:1px solid var(--line);
        font-size:10.5px;letter-spacing:.09em;text-transform:uppercase}
.tbl td{padding:8px 6px;border-bottom:1px solid #232B34;color:#C3CEDA}
.tbl td:first-child{color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));z-index:60;
       background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:9px;font-family:var(--mono);
       font-size:12.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .22s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
:focus-visible{outline:2px solid var(--p20);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.plate{animation:none}}
</style>
</head>

/* ============================================================
   ALMACENAMIENTO — mini base de datos en el navegador
   IndexedDB con dos almacenes:
     · estado    → una fila: semana, pesos, sesión a medias
     · historial → una fila por serie hecha, con índices por fecha
                   y por ejercicio
   Si IndexedDB no está (Safari en navegación privada), cae solo
   a localStorage y la app no se entera.
   Todo vive en el teléfono. No hay servidor ni cuenta que crear.
   ============================================================ */
const DB = (() => {
  const NAME = "operacion-cbr", VER = 1, KEY = "estado";
  const LS = "operacion-cbr:v1", LSH = "operacion-cbr:v1:hist";
  let dbp = null, mode = "idb";

  function open(){
    if(dbp) return dbp;
    dbp = new Promise((ok, ko) => {
      if(!self.indexedDB) return ko(new Error("sin IndexedDB"));
      const rq = indexedDB.open(NAME, VER);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        if(!db.objectStoreNames.contains("estado")) db.createObjectStore("estado");
        if(!db.objectStoreNames.contains("historial")){
          const h = db.createObjectStore("historial", { keyPath:"id", autoIncrement:true });
          h.createIndex("fecha", "f");
          h.createIndex("ejercicio", "ej");
        }
      };
      rq.onsuccess = () => ok(rq.result);
      rq.onerror   = () => ko(rq.error);
      rq.onblocked = () => ko(new Error("base bloqueada por otra pestaña"));
    });
    return dbp;
  }
  const ask  = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
  const done = t => new Promise((ok, ko) => { t.oncomplete = () => ok(); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error); });
  const lsHist = () => { try{ return JSON.parse(localStorage.getItem(LSH) || "[]"); }catch(e){ return []; } };
  const plain  = o => JSON.parse(JSON.stringify(o));

  return {
    /* Decide el motor una sola vez, al arrancar. */
    async init(){
      try{ await open(); mode = "idb"; }
      catch(e){ mode = "ls"; console.warn("IndexedDB no disponible, uso localStorage:", e.message); }
      return mode;
    },
    get mode(){ return mode; },

    async load(){
      try{
        if(mode === "ls") return JSON.parse(localStorage.getItem(LS) || "null");
        const db = await open();
        return await ask(db.transaction("estado", "readonly").objectStore("estado").get(KEY)) || null;
      }catch(e){ console.warn("No se pudo leer:", e); return null; }
    },
    async save(d){
      try{
        if(mode === "ls"){ localStorage.setItem(LS, JSON.stringify(d)); return; }
        const db = await open();
        const t = db.transaction("estado", "readwrite");
        t.objectStore("estado").put(plain(d), KEY);
        await done(t);
      }catch(e){ console.warn("No se pudo guardar:", e); toast("Ojo: no se ha podido guardar"); }
    },

    async addHistory(rows){
      if(!rows.length) return;
      try{
        if(mode === "ls"){
          const h = lsHist(); let id = h.length ? h[h.length-1].id : 0;
          rows.forEach(r => h.push(Object.assign({ id: ++id }, r)));
          localStorage.setItem(LSH, JSON.stringify(h)); return;
        }
        const db = await open();
        const t = db.transaction("historial", "readwrite"), st = t.objectStore("historial");
        rows.forEach(r => st.add(plain(r)));
        await done(t);
      }catch(e){ console.warn("No se pudo guardar el historial:", e); toast("Ojo: el historial no se ha guardado"); }
    },
    async allHistory(){
      try{
        if(mode === "ls") return lsHist();
        const db = await open();
        return await ask(db.transaction("historial", "readonly").objectStore("historial").getAll()) || [];
      }catch(e){ return []; }
    },
    async countHistory(){
      try{
        if(mode === "ls") return lsHist().length;
        const db = await open();
        return await ask(db.transaction("historial", "readonly").objectStore("historial").count());
      }catch(e){ return 0; }
    },
    async clearHistory(){
      if(mode === "ls"){ localStorage.removeItem(LSH); return; }
      const db = await open();
      const t = db.transaction("historial", "readwrite");
      t.objectStore("historial").clear();
      await done(t);
    },

    /* Copia de seguridad completa, para llevarte los datos a otro móvil. */
    async exportAll(){ return { app:"operacion-cbr", v:1, estado: await this.load(), historial: await this.allHistory() }; },
    async importAll(data){
      if(!data || data.app !== "operacion-cbr") throw new Error("Ese archivo no es una copia de Operación CBR");
      await this.clearHistory();
      if(data.estado) await this.save(data.estado);
      const filas = (data.historial || []).map(r => { const c = Object.assign({}, r); delete c.id; return c; });
      await this.addHistory(filas);
      return filas.length;
    }
  };
})();

/* ---------- cargador de barra (widget de discos) ---------- */
function plateHTML(kg){
  const p = PLATE[kg];
  return `<div class="plate" style="background:${p.c};color:${p.t};height:${p.h}px;width:${p.w}px">${kg}</div>`;
}
function barHTML(total){
  const cfg = LOADS.find(l => l.total === total);
  if(!cfg) return "";
  if(cfg.total === BAR) return `<div class="bar"><span class="bar__empty">Barra sola · 20 kg</span></div>`;
  const left  = [...cfg.L].sort((a,b) => a-b).map(plateHTML).join("");
  const right = [...cfg.R].sort((a,b) => b-a).map(plateHTML).join("");
  return `<div class="bar">
      <div class="bar__side bar__side--l">${left}</div>
      <div class="bar__shaft"></div>
      <div class="bar__side bar__side--r">${right}</div>
    </div>
    <div class="bar__tags"><span>Izquierda ${cfg.L.join(" + ")}</span><span>Derecha ${cfg.R.join(" + ")}</span></div>`;
}

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const lerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
const pts = arr => arr.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
const toeOf = (p,k) => p[k] || [p[k==="toe"?"ft":"ft2"][0]+11, p[k==="toe"?"ft":"ft2"][1]];

function buildFigure(figKey){
  const f = FIG[figKey];
  const svg = el("svg", { viewBox:"0 0 200 145", class:"tech__stage", "aria-hidden":"true" });

  const gStatic = el("g", {}), gImp = el("g", {}), gBody = el("g", {});
  svg.append(gStatic, gImp, gBody);

  /* --- material estático --- */
  f.gear.forEach(g => {
    const [kind, args] = g.split(":");
    const n = (args||"").split(",").map(Number);
    if(kind === "floor"){
      gStatic.append(el("line", { x1:0, y1:134.5, x2:200, y2:134.5, stroke:"#3B4854", "stroke-width":1.5 }));
    }
    if(kind === "bench"){
      gStatic.append(el("rect", { x:n[0], y:n[2], width:n[1]-n[0], height:7, rx:2, fill:"#2C3742" }));
      gStatic.append(el("line", { x1:n[0]+6, y1:n[2]+7, x2:n[0]+6, y2:134, stroke:"#2C3742", "stroke-width":4 }));
      gStatic.append(el("line", { x1:n[1]-6, y1:n[2]+7, x2:n[1]-6, y2:134, stroke:"#2C3742", "stroke-width":4 }));
    }
    if(kind === "rack"){
      [26,150].forEach(x => gStatic.append(el("line", { x1:x, y1:32, x2:x, y2:134, stroke:"#2C3742", "stroke-width":5 })));
      /* pines de seguridad, en rojo: es la parte que salva la vida */
      gStatic.append(el("line", { x1:26, y1:70, x2:44, y2:70, stroke:"var(--p25)", "stroke-width":3 }));
      gStatic.append(el("line", { x1:132, y1:70, x2:150, y2:70, stroke:"var(--p25)", "stroke-width":3 }));
    }
    if(kind === "pullbar"){
      [44,156].forEach(x => gStatic.append(el("line", { x1:x, y1:18, x2:x, y2:134, stroke:"#2C3742", "stroke-width":5 })));
      gStatic.append(el("line", { x1:44, y1:20, x2:156, y2:20, stroke:"#4A5866", "stroke-width":4, "stroke-linecap":"round" }));
    }
    if(kind === "fixbar"){
      [40,160].forEach(x => gStatic.append(el("line", { x1:x, y1:40, x2:x, y2:134, stroke:"#2C3742", "stroke-width":5 })));
      gStatic.append(el("line", { x1:40, y1:n[1], x2:160, y2:n[1], stroke:"#4A5866", "stroke-width":4, "stroke-linecap":"round" }));
    }
    if(kind === "incline"){
      gStatic.append(el("line", { x1:100, y1:132, x2:100, y2:96, stroke:"#2C3742", "stroke-width":5 }));
      gStatic.append(el("ellipse", { cx:100, cy:92, rx:20, ry:7, fill:"#2C3742" }));
    }
  });

  /* --- implemento dinámico --- */
  let imp = null;
  const kind = (f.imp||"").split(":")[0];
  const anch = (f.imp||"").split(":")[1];
  if(kind === "barSide"){
    imp = el("circle", { r:7, fill:"none", stroke:"var(--p20)", "stroke-width":4 });
    gImp.append(imp);
  } else if(kind === "barBig"){
    imp = el("circle", { r:13, fill:"none", stroke:"var(--p25)", "stroke-width":5 });
    gImp.append(imp);
  } else if(kind === "discSide"){
    imp = el("circle", { r:8, fill:"none", stroke:"var(--p15)", "stroke-width":4 });
    gImp.append(imp);
  } else if(kind === "landmine"){
    const a = anch.split(",").map(Number);
    imp = el("line", { x1:a[0], y1:a[1], stroke:"#8B9AA8", "stroke-width":3, "stroke-linecap":"round" });
    gImp.append(el("circle", { cx:a[0], cy:a[1], r:4, fill:"#4A5866" }), imp);
  } else if(kind === "barFront"){
    imp = el("g", {});
    const shaft = el("line", { stroke:"#8B9AA8", "stroke-width":3.5, "stroke-linecap":"round" });
    const pl = el("line", { stroke:"var(--p20)", "stroke-width":10, "stroke-linecap":"round" });
    const pr = el("line", { stroke:"var(--p20)", "stroke-width":10, "stroke-linecap":"round" });
    imp.append(shaft, pl, pr); imp._parts = { shaft, pl, pr }; gImp.append(imp);
  } else if(kind === "dumbbells"){
    imp = el("g", {});
    const a = el("line", { stroke:"var(--p10)", "stroke-width":8, "stroke-linecap":"round" });
    const b = el("line", { stroke:"var(--p10)", "stroke-width":8, "stroke-linecap":"round" });
    imp.append(a,b); imp._parts = { a, b }; gImp.append(imp);
  }

  /* --- cuerpo --- */
  const mk = w => el("polyline", { fill:"none", stroke:"#E8EDF2", "stroke-width":w,
                                   "stroke-linecap":"round", "stroke-linejoin":"round" });
  const far = w => el("polyline", { fill:"none", stroke:"#66757F", "stroke-width":w,
                                    "stroke-linecap":"round", "stroke-linejoin":"round" });
  const torso = mk(5), legA = mk(4.5), armA = mk(4);
  const legB = far(4.5), armB = far(4);
  const head = el("circle", { r:8, fill:"none", stroke:"#E8EDF2", "stroke-width":4 });
  const neck = mk(3.5);
  const shbar = mk(4.5);
  gBody.append(legB, armB, torso, shbar, legA, armA, neck, head);

  const hasL2 = !!f.a.kn2, hasA2 = !!f.a.el2;
  if(!hasL2) legB.style.display = "none";
  if(!hasA2) armB.style.display = "none";
  if(f.view !== "front") shbar.style.display = "none";

  function update(t){
    const A = f.a, Z = f.z, P = {};
    for(const k in A) P[k] = lerp(A[k], Z[k], t);

    const swx = f.view === "front" ? 14 : 0;
    const shR = [P.sh[0]+swx, P.sh[1]], shL = [P.sh[0]-swx, P.sh[1]];

    torso.setAttribute("points", pts([P.sh, P.hip]));
    if(f.view === "front") shbar.setAttribute("points", pts([shL, shR]));
    neck.setAttribute("points", pts([P.sh, P.h]));
    head.setAttribute("cx", P.h[0]); head.setAttribute("cy", P.h[1]);

    legA.setAttribute("points", pts([P.hip, P.kn, P.ft, toeOf(P,"toe")]));
    if(hasL2) legB.setAttribute("points", pts([P.hip, P.kn2, P.ft2, toeOf(P,"toe2")]));

    armA.setAttribute("points", pts([shR, P.el, P.hd]));
    if(hasA2) armB.setAttribute("points", pts([shL, P.el2, P.hd2]));

    if(imp && P.b){
      if(kind === "barSide" || kind === "barBig" || kind === "discSide"){
        imp.setAttribute("cx", P.b[0]); imp.setAttribute("cy", P.b[1]);
      } else if(kind === "landmine"){
        imp.setAttribute("x2", P.b[0]); imp.setAttribute("y2", P.b[1]);
      } else if(kind === "barFront"){
        const y = P.b[1], p = imp._parts;
        p.shaft.setAttribute("x1", 58); p.shaft.setAttribute("x2", 142);
        p.shaft.setAttribute("y1", y); p.shaft.setAttribute("y2", y);
        p.pl.setAttribute("x1", 58); p.pl.setAttribute("x2", 66);
        p.pl.setAttribute("y1", y); p.pl.setAttribute("y2", y);
        p.pr.setAttribute("x1", 134); p.pr.setAttribute("x2", 142);
        p.pr.setAttribute("y1", y); p.pr.setAttribute("y2", y);
      }
    }
    if(kind === "dumbbells"){
      const p = imp._parts;
      p.a.setAttribute("x1", P.hd[0]-4); p.a.setAttribute("x2", P.hd[0]+4);
      p.a.setAttribute("y1", P.hd[1]);   p.a.setAttribute("y2", P.hd[1]);
      p.b.setAttribute("x1", P.hd2[0]-4);p.b.setAttribute("x2", P.hd2[0]+4);
      p.b.setAttribute("y1", P.hd2[1]);  p.b.setAttribute("y2", P.hd2[1]);
    }
  }
  return { svg, update };
}

/* animación: ida y vuelta con pausa en los extremos */
let animId = null;
function animate(fig){
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ fig.update(1); return; }
  const T0 = performance.now(), PERIOD = 3400, HOLD = .18;
  function frame(now){
    let u = ((now - T0) % PERIOD) / PERIOD;      // 0..1
    let s = u < .5 ? u*2 : (1-u)*2;              // triángulo
    s = Math.min(1, Math.max(0, (s - HOLD) / (1 - 2*HOLD)));
    fig.update(0.5 - Math.cos(s*Math.PI)/2);     // suavizado
    animId = requestAnimationFrame(frame);
  }
  animId = requestAnimationFrame(frame);
}
function stopAnim(){ if(animId) cancelAnimationFrame(animId); animId = null; }

          <span class="reps__val">${st.reps}</span>

function renderGuide(){

  $("view").innerHTML = `<div class="guide">

    <p>Son esquemas, no un vídeo. Sirven para recordar el patrón, no para aprenderlo de cero. Si un movimiento es nuevo para ti, grábate de lado la primera serie y compárala.</p>

    <h2>Cómo elegir el peso</h2>
    <p>Cada serie termina con <strong>2–3 reps en recámara</strong>. Si acabas y podrías hacer cinco más, es calentamiento. Si fallas antes de llegar al rango, has puesto demasiado. Ajusta el mismo día, no la semana siguiente.</p>
    <p>La semana 1 es de tanteo. Los pesos que trae la app son un punto de partida para 122 kg y vuelta al hierro, no una prescripción.</p>

    <h2>Doble progresión</h2>
    <p>Tus discos solo permiten saltos de 10 kg, y eso es brutal en press militar (30→40 es un +33%). Por eso no se sube peso hasta agotar las reps:</p>
    <ul>
      <li>Empiezas abajo del rango — por ejemplo <code>4×8</code>.</li>
      <li>Sumas reps cada semana con el mismo peso hasta el techo — <code>4×12</code>.</li>

function render(){ renderTabs(); if(tab === 5) renderGuide(); else renderDay(); }

/* ---------- descanso ---------- */
let restId = null, restLeft = 0, restTotal = 0;
function startRest(sec){
  clearInterval(restId); restLeft = restTotal = sec;
  $("rest").classList.add("on"); tickRest();
  restId = setInterval(() => { restLeft--; tickRest(); if(restLeft <= 0) endRest(true); }, 1000);
}
function tickRest(){
  $("restT").textContent = mmss(Math.max(restLeft, 0));
  $("restF").style.width = (Math.max(restLeft, 0) / restTotal * 100) + "%";
}
function endRest(done){
  clearInterval(restId); restId = null; $("rest").classList.remove("on");
  if(done){ try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch(e){} }
}
$("restSkip").addEventListener("click", () => endRest(false));

/* ---------- eventos ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button");
  if(!t) return;

  if(t.dataset.tab !== undefined){ tab = +t.dataset.tab; openTech = null; render(); window.scrollTo(0,0); return; }

  if(t.dataset.t){
    openTech = (openTech === t.dataset.t) ? null : t.dataset.t;
    const y = window.scrollY; render(); window.scrollTo(0, y);
    return;
  }

  if(t.dataset.w){
    const ex = DAYS[tab].ex.find(x => x.id === t.dataset.w);
    const steps = stepsFor(ex), i = steps.indexOf(weightOf(ex)) + (+t.dataset.dir);
    if(i >= 0 && i < steps.length){ S.weights[ex.id] = steps[i]; S.ready[ex.id] = false; await DB.save(S);
      const y = window.scrollY; render(); window.scrollTo(0, y); }
    return;
  }

  if(t.dataset.r){
    const ex = DAYS[tab].ex.find(x => x.id === t.dataset.r), st = sess(ex);
    st.reps = Math.max(0, st.reps + (+t.dataset.dir) * (ex.id === "plancha" ? 5 : 1));
    await DB.save(S); const y = window.scrollY; render(); window.scrollTo(0, y);
    return;
  }

  if(t.dataset.s){
    const ex = DAYS[tab].ex.find(x => x.id === t.dataset.s), st = sess(ex), k = +t.dataset.k;
    st.done[k] = !st.done[k];
    await DB.save(S); const y = window.scrollY; render(); window.scrollTo(0, y);
    if(st.done[k]) startRest(+t.dataset.rest);
    return;
  }

  if(t.id === "finish"){
    const d = DAYS[tab]; let subidas = 0; const filas = [];
    const hoy = new Date().toISOString().slice(0,10);
    d.ex.forEach(ex => {
      const st = sess(ex);
      if(st.done.every(Boolean) && st.reps >= ex.hi && ex.type !== "dumbbell" && ex.type !== "body"){
        S.ready[ex.id] = true; subidas++;
      }
      filas.push({ f:hoy, sem:S.week, dia:d.n, ej:ex.name,
                   kg:weightOf(ex), series:st.done.filter(Boolean).length, reps:st.reps });
      delete S.session[ex.id];
    });
    await DB.addHistory(filas); histN += filas.length;
    openTech = null; await DB.save(S); render(); window.scrollTo(0,0);
    toast(subidas ? `Guardado · ${subidas} ejercicio${subidas>1?"s":""} listo${subidas>1?"s":""} para subir peso` : "Sesión guardada");
    return;
  }

  if(t.id === "reset"){
    DAYS[tab].ex.forEach(ex => delete S.session[ex.id]);
    await DB.save(S); render(); toast("Día vaciado");
    return;
  }

  if(t.id === "nextwk"){ S.week++; await DB.save(S); render(); toast("Semana " + S.week); return; }

  if(t.id === "exp"){
    const filas = await DB.allHistory();
    if(!filas.length){ toast("Todavía no hay sesiones guardadas"); return; }
    const csv = "fecha,semana,dia,ejercicio,kg,series,reps\n" +
      filas.map(r => [r.f,r.sem,r.dia,`"${r.ej}"`,r.kg,r.series,r.reps].join(",")).join("\n");
    bajar("operacion-cbr.csv", csv, "text/csv");
    toast(filas.length + " series exportadas");
    return;
  }

  if(t.id === "expjson"){
    const copia = await DB.exportAll();
    bajar(`operacion-cbr-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(copia), "application/json");
    toast("Copia de seguridad descargada");
    return;
  }

  if(t.id === "imp"){ $("impFile").click(); return; }
});

function bajar(nombre, texto, tipo){
  const url = URL.createObjectURL(new Blob([texto], { type: tipo }));
  const a = document.createElement("a");
  a.href = url; a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* Restaurar copia: sustituye todo lo que haya. */
document.addEventListener("change", async e => {
  if(e.target.id !== "impFile") return;
  const file = e.target.files[0]; e.target.value = "";
  if(!file) return;
  if(!confirm("Esto reemplaza los datos que tengas ahora en este móvil. ¿Seguimos?")) return;
  try{
    const n = await DB.importAll(JSON.parse(await file.text()));
    const saved = await DB.load();
    S = Object.assign({ week:1, weights:{}, ready:{}, session:{} }, saved || {});
    histN = n; render(); toast(`Restaurado · ${n} series`);
  }catch(err){ toast(err.message || "No se pudo leer el archivo"); }
});

/* ---------- arranque ---------- */
(async () => {
  await DB.init();
  const saved = await DB.load();
  if(saved) S = Object.assign(S, saved);

  /* Migración: las primeras versiones metían el historial dentro del estado. */
  if(Array.isArray(S.history)){
    if(S.history.length) await DB.addHistory(S.history);
    delete S.history;
    await DB.save(S);
  }

  histN = await DB.countHistory();
  render();
})();

/* ---------- service worker: que funcione sin cobertura ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener("statechange", () => {
          /* Solo avisamos: recargar a media serie sería una faena. */
          if(nuevo.state === "installed" && navigator.serviceWorker.controller){
            toast("Hay una versión nueva · ciérrala y ábrela para actualizar");
          }
        });
      });
    }).catch(e => console.warn("Service worker no registrado:", e));
  });
}
