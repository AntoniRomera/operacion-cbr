<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sistema">
<meta name="theme-color" content="#080B11">
<meta name="description" content="Registro de entreno con barra y discos, con niveles, rangos y logros. Funciona sin conexión y guarda todo en el propio móvil.">
<title>SISTEMA — Registro de cazador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<link rel="icon" href="icons/favicon-32-v2.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sistema.css">
</head>
<body>

<header class="top" id="cabecera"></header>

<main id="app"></main>

<div class="pie" id="pie">
  <div class="descanso" id="descanso">
    <div class="descanso__t" id="descansoT">1:30</div>
    <div class="descanso__via"><div class="descanso__fill" id="descansoF"></div></div>
    <button class="descanso__saltar" id="descansoSaltar">Saltar</button>
  </div>
  <nav class="nav" id="nav" aria-label="Secciones"></nav>
</div>

<div class="aviso" id="aviso"></div>

<noscript>
  <p style="padding:24px;color:#E6EDF7;font-family:system-ui">
    Esta app necesita JavaScript: todo el registro de series ocurre en tu propio navegador.
  </p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
